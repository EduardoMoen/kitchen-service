{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block title %}Dish Type{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-5">

      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
          <h4 class="mb-0">
            🍲️ {{ object|yesno:"Update Dish Type,Create Dish Type" }}
          </h4>
        </div>

        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            {{ form|crispy }}

            <div class="d-flex justify-content-end mt-3">
              <button type="submit" class="btn btn-success">
                💾 Save
              </button>
            </div>
          </form>
        </div>

      </div>

    </div>
  </div>
</div>
{% endblock %}
