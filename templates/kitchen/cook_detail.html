{% extends "base.html" %}

{% block title %}Cook{% endblock %}

{% block content %}
<h1>Cook Detail View</h1>
<p class="mt-4">Cook: {{ cook.username }}</p>
{% if cook.years_of_experience %}
  <p>Years od experience: {{ cook.years_of_experience }}</p>
{% endif %}
<a class="mt-4 btn btn-primary" href="{% url 'kitchen:cook-update' cook.id %}">Update</a>
<a class="mt-4 btn btn-danger" href="{% url 'kitchen:cook-delete' cook.id %}">Delete</a>
{% endblock %}
