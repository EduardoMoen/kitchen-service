{% extends "base.html" %}

{% block content %}
<h1>Login Page</h1>

<form class="mt-4" action="{% url 'login' %}" method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <input class="btn btn-primary" type="submit" value="Login">
  <input type="hidden" name="next" value="{{ next }}">
</form>
{% endblock %}
