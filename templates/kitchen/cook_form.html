{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block title %}Cook{% endblock %}

{% block content %}
<div class="col-6">
  <h1>Cook {{ object|yesno:"Update, Create" }} View</h1>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <input class="btn btn-primary" type="submit" value="Submit">
  </form>
</div>
{% endblock %}
