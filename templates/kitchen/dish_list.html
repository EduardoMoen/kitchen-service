{% extends "base.html" %}

{% block title %}Dish{% endblock %}

{% block content %}
<h1>Dish List <a class="btn btn-success" href="{% url 'kitchen:dish-create' %}">Create</a></h1>
<form class="d-flex" method="get">
  {{ search_form }}
  <input class="btn btn-secondary" type="submit" value="Search">
</form>
<table class="table">
  <thead>
    <tr>
      <th>Dish Name</th>
      <th>Price</th>
      <th>Details</th>
    </tr>
  </thead>
  <tbody>
    {% for dish in dish_list %}
      <tr>
        <td>{{ dish.name }}</td>
        <td>${{ dish.price }}</td>
        <td><a class="btn btn-primary" href="{% url 'kitchen:dish-detail' dish.id %}">Detail</a></td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
