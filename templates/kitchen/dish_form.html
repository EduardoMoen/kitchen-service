{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block title %}Dish{% endblock %}

{% block content %}
<div class="col-6">
  <h1>{{ object|yesno:"Update, Create" }} Dish</h1>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <input class="btn btn-primary" type="submit" value="Submit">
  </form>
</div>
{% endblock %}
